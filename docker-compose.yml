version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: retail-postgres
    restart: always
    environment:
      POSTGRES_DB: retail_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: retail-backend
    restart: always
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/retail_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      AI_SERVICE_URL: http://ai-service:8000
      INTERNAL_AUTH_TOKEN: retail-internal-secret-token-v1
    ports:
      - "8080:8080"

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: retail-ai-service
    restart: always
    environment:
      INTERNAL_AUTH_TOKEN: retail-internal-secret-token-v1
      BUSINESS_API_BASE_URL: http://backend:8080/internal/api/v1/business
      LLM_PROVIDER: mock # or gemini / openai
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "8000:8000"

volumes:
  pgdata:
