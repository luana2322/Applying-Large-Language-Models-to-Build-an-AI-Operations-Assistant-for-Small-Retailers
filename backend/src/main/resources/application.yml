server:
  port: 8080

spring:
  application:
    name: retail-assistant-backend
  # Defaults to in-memory H2 for local dev & tests. Override via env for PostgreSQL
  # (docker-compose sets SPRING_DATASOURCE_* so the URL, driver and dialect switch together).
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:retaildb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driverClassName: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:create-drop}
    show-sql: false

app:
  ai-service-url: ${AI_SERVICE_URL:http://localhost:8000}
  internal-auth-token: ${INTERNAL_AUTH_TOKEN:retail-internal-secret-token-v1}
  seed-data:
    # Demo/seed business data is for local dev & tests only. Set to false in production
    # so that real ERP/POS data is never mixed with generated sample data.
    enabled: ${APP_SEED_DATA_ENABLED:true}
  ai:
    max-stored-chars: ${AI_MAX_STORED_CHARS:20000}
